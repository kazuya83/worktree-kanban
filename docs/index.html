<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Worktree Kanban</title>
  <meta name="description" content="A board for chaining AI coding agents into flowcharts, where people make the key decisions: implement with Codex, review with Claude, and send it back if needed.">
  <link rel="icon" href="images/icon.png">
  <style>
    :root { --ink: #1f2430; --muted: #646b7a; --line: #dfe2e9; --accent: #3b5bfd; --bg: #f6f7f9; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans CJK SC", sans-serif; }
    header { display: flex; align-items: center; gap: 10px; max-width: 980px; margin: 0 auto; padding: 18px 20px; font-weight: 600; }
    header img { width: 28px; height: 28px; }
    header select { margin-left: auto; font: inherit; font-weight: 400; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: inherit; }
    main { max-width: 980px; margin: 0 auto; padding: 24px 20px 56px; text-align: center; }
    h1 { margin: 0 auto 28px; max-width: 800px; font-size: clamp(26px, 4.4vw, 40px); line-height: 1.25; }
    .download { display: inline-block; padding: 13px 28px; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; }
    .download:hover { filter: brightness(1.08); }
    .others { margin: 12px 0 0; color: var(--muted); font-size: 14px; }
    .others a { color: inherit; margin: 0 6px; }
    .demo { display: block; width: 100%; margin: 32px 0 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
    .note { margin: 0; color: var(--muted); font-size: 14px; }
    .showcase { margin: 44px 0 0; }
    .showcase h2 { margin: 0 0 8px; font-size: clamp(20px, 3vw, 26px); }
    .showcase p { max-width: 720px; margin: 0 auto; color: var(--muted); }
    .showcase .demo { margin: 20px 0 0; }
    .commands { margin: 40px 0 28px; text-align: left; }
    .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
    .tabs button { padding: 7px 14px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--muted); font: inherit; font-size: 14px; cursor: pointer; }
    .tabs button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .command { margin-bottom: 16px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
    .command h2 { margin: 0 0 4px; font-size: 17px; }
    .command p { margin: 0 0 10px; color: var(--muted); font-size: 14px; }
    .code { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; background: #1f2430; }
    .code code { flex: 1; overflow-x: auto; color: #f3f4f7; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }
    .code button { flex: none; padding: 4px 10px; border: 0; border-radius: 6px; background: #3a4152; color: #fff; font: inherit; font-size: 13px; cursor: pointer; }
    footer { padding: 0 20px 32px; text-align: center; color: var(--muted); font-size: 14px; }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <header>
    <img src="images/icon.png" alt="">
    <span>Worktree Kanban</span>
    <select id="lang" aria-label="Language">
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
      <option value="zh">简体中文</option>
    </select>
  </header>
  <main>
    <h1 id="headline"></h1>
    <a class="download" id="download" href="https://github.com/kazuya83/worktree-kanban/releases/latest"></a>
    <p class="others" id="others"></p>
    <img class="demo" id="demo" alt="">
    <p class="note" id="integrations"></p>
    <section class="showcase">
      <h2 id="progressTitle"></h2>
      <p id="progressDesc"></p>
      <img class="demo" id="progressDemo" alt="" loading="lazy">
    </section>
    <section class="commands">
      <div class="tabs" id="tabs">
        <button type="button" data-os="unix">Mac / Linux</button>
        <button type="button" data-os="windows">Windows</button>
      </div>
      <div class="command">
        <h2 id="installTitle"></h2>
        <p id="installDesc"></p>
        <div class="code"><code data-command></code><button type="button" data-copy></button></div>
      </div>
      <div class="command">
        <h2 id="updateTitle"></h2>
        <p id="updateDesc"></p>
        <div class="code"><code data-command></code><button type="button" data-copy></button></div>
      </div>
    </section>
    <p class="note" id="note"></p>
  </main>
  <footer><a id="migrate" href="migrate-from-vibe-kanban.html"></a> · <a id="migrateConductor" href="migrate-from-conductor.html"></a> · <span id="footerExtras"></span><a href="https://github.com/kazuya83/worktree-kanban">GitHub</a> · <a href="https://github.com/kazuya83/worktree-kanban/blob/main/LICENSE">FSL-1.1-ALv2 License</a></footer>
  <script>
    const REPO = 'kazuya83/worktree-kanban';
    const RELEASES = `https://github.com/${REPO}/releases/latest`;
    const FILES = {
      'mac-arm64': (v) => `worktree-kanban-${v}-mac-arm64.dmg`,
      'mac-x64': (v) => `worktree-kanban-${v}-mac-x64.dmg`,
      windows: (v) => `worktree-kanban-${v}-win-setup.exe`,
      linux: (v) => `worktree-kanban-${v}-linux-x86_64.AppImage`,
    };
    const NAMES = { 'mac-arm64': 'Mac (Apple Silicon)', 'mac-x64': 'Mac (Intel)', windows: 'Windows', linux: 'Linux' };
    const COMMANDS = {
      unix: `curl -fsSL https://raw.githubusercontent.com/${REPO}/main/install.sh | bash`,
      windows: `irm https://raw.githubusercontent.com/${REPO}/main/install.ps1 | iex`,
    };
    const TEXT = {
      en: { progressTitle: 'Watch your agents work', progressDesc: 'Each agent becomes a pixel-art robot on its card. It shows what it is doing right now, raises its hand when it needs your approval, walks a road of TODO flags, and jumps at the finish line when the task is done. You can see where every task stands without reading a single log.', progressAlt: 'The robot on each card works away, and in the Progress tab it walks a road of TODO flags and jumps at the finish line when the task is done', integrations: 'Works with GitHub, GitLab, Linear, Jira, and Slack: start tasks from Issues, keep their status in sync, and get notifications in Slack.', migrate: 'Moving from Vibe Kanban?', migrateConductor: 'Moving from Conductor?', stats: 'Download stats', headline: 'A board for chaining AI coding agents into flowcharts, where people make the key decisions: implement with Codex, review with Claude, and send it back if needed.', download: 'Download for {os}', all: 'All downloads', demo: 'Demo: describe a flow in plain language, watch Codex implement and Claude review and send it back, approve a command, check the diff, and merge', note: 'The builds are not signed or notarized, so your OS may warn you the first time you open the app.' , installTitle: 'Install', installDesc: 'Run this in Terminal on Mac or Linux, or in PowerShell on Windows.', updateTitle: 'Update', updateDesc: 'The same command replaces the app with the latest version. Your board and tasks are kept.', copy: 'Copy', copied: 'Copied' },
      ja: { progressTitle: 'エージェントが働く様子が、ひと目で分かる', progressDesc: 'エージェントはピクセルアートのロボットになって、カードの上で働きます。今の作業を吹き出しで見せ、承認や返事が要るときは手を挙げて知らせ、TODO の旗が並ぶ道を進んで、完了するとゴールで跳ねます。ログを読まなくても、どのタスクがどこまで進んだかが分かります。', progressAlt: 'カードのロボットが作業し、「進捗」タブでは TODO の旗が並ぶ道を進んで、完了するとゴールで跳ねる', integrations: 'GitHub・GitLab・Linear・Jira・Slack と連携できます。Issue からタスクを作り、状態を同期し、Slack で通知を受け取れます。', migrate: 'Vibe Kanban から移る方法', migrateConductor: 'Conductor から移る方法', stats: 'ダウンロード数', headline: '複数の AI エージェントをフローチャートで組み、要所は人が決めるボード。Codex で実装して Claude でレビューし、直すところがあれば差し戻します。', download: '{os} 版をダウンロード', all: 'すべてのダウンロード', demo: 'デモ: 文章でフローを組み、Codex の実装を Claude がレビューして差し戻し、人がコマンドを承認し、差分を確かめてマージする', note: 'アプリには署名・公証がないため、初めて開くときに OS の警告が出ることがあります。' , installTitle: 'インストール', installDesc: 'Mac・Linux はターミナル、Windows は PowerShell で実行します。', updateTitle: 'アップデート', updateDesc: '同じコマンドで最新版に入れ替わります。ボードやタスクのデータはそのまま残ります。', copy: 'コピー', copied: 'コピーしました' },
      es: { progressTitle: 'Mira trabajar a tus agentes', progressDesc: 'Cada agente se convierte en un robot de pixel art sobre su tarjeta. Muestra lo que está haciendo, levanta la mano cuando necesita tu aprobación, recorre un camino de banderas TODO y salta en la meta cuando la tarea termina. Sabes cómo va cada tarea sin leer ni un registro.', progressAlt: 'El robot de cada tarjeta trabaja y, en la pestaña Progreso, recorre un camino de banderas TODO y salta en la meta cuando la tarea termina', integrations: 'Funciona con GitHub, GitLab, Linear, Jira y Slack: crea tareas desde Issues, sincroniza su estado y recibe notificaciones en Slack.', migrate: '¿Vienes de Vibe Kanban?', migrateConductor: '¿Vienes de Conductor?', stats: 'Descargas', headline: 'Un tablero para combinar agentes de programación con IA en diagramas de flujo, donde las decisiones clave las toman las personas: implementa con Codex, revisa con Claude y devuelve el trabajo si hace falta.', download: 'Descargar para {os}', all: 'Todas las descargas', demo: 'Demostración: describir un flujo en lenguaje natural, ver cómo Codex implementa y Claude revisa y devuelve el trabajo, aprobar un comando, revisar el diff y fusionar', note: 'Las compilaciones no están firmadas ni notarizadas, así que el sistema puede avisarte la primera vez que abras la aplicación.' , installTitle: 'Instalar', installDesc: 'Ejecútalo en Terminal en Mac o Linux, o en PowerShell en Windows.', updateTitle: 'Actualizar', updateDesc: 'El mismo comando sustituye la aplicación por la última versión. Tu tablero y tus tareas se conservan.', copy: 'Copiar', copied: 'Copiado' },
      fr: { progressTitle: 'Regardez vos agents travailler', progressDesc: "Chaque agent devient un robot en pixel art sur sa carte. Il montre ce qu'il fait, lève la main quand il attend votre approbation, parcourt une route de drapeaux TODO et saute à l'arrivée quand la tâche est terminée. Vous voyez où en est chaque tâche sans lire le moindre journal.", progressAlt: "Le robot de chaque carte travaille et, dans l'onglet Progression, il parcourt une route de drapeaux TODO et saute à l'arrivée quand la tâche est terminée", integrations: 'Fonctionne avec GitHub, GitLab, Linear, Jira et Slack : créez des tâches depuis des Issues, synchronisez leur statut et recevez des notifications dans Slack.', migrate: 'Vous quittez Vibe Kanban ?', migrateConductor: 'Vous quittez Conductor ?', stats: 'Téléchargements', headline: 'Un tableau pour enchaîner des agents de code IA en organigrammes, où les humains prennent les décisions clés : implémentez avec Codex, relisez avec Claude et renvoyez le travail si besoin.', download: 'Télécharger pour {os}', all: 'Tous les téléchargements', demo: 'Démonstration : décrire un flux en langage naturel, voir Codex implémenter et Claude relire puis renvoyer le travail, approuver une commande, vérifier le diff et fusionner', note: "Les versions ne sont ni signées ni notariées : votre système peut afficher un avertissement à la première ouverture." , installTitle: 'Installer', installDesc: 'Exécutez cette commande dans le Terminal sur Mac ou Linux, ou dans PowerShell sur Windows.', updateTitle: 'Mettre à jour', updateDesc: "La même commande remplace l'application par la dernière version. Votre tableau et vos tâches sont conservés.", copy: 'Copier', copied: 'Copié' },
      zh: { progressTitle: '看着你的代理工作', progressDesc: '每个代理都会变成卡片上的像素风机器人。它会显示正在做的事，需要你批准时举手示意，沿着 TODO 旗子的道路前进，任务完成时在终点跳起来。不用读日志，就能知道每个任务进行到了哪里。', progressAlt: '每张卡片上的机器人在工作；在“进度”标签页中，它沿着 TODO 旗子的道路前进，任务完成时在终点跳起来', integrations: '支持 GitHub、GitLab、Linear、Jira 和 Slack：从 Issue 创建任务、同步状态，并在 Slack 中接收通知。', migrate: '从 Vibe Kanban 迁移', migrateConductor: '从 Conductor 迁移', stats: '下载统计', headline: '用流程图编排多个 AI 编程代理、关键决定由人来做的看板：用 Codex 实现，用 Claude 审查，需要修改时退回。', download: '下载 {os} 版', all: '全部下载', demo: '演示：用自然语言描述流程，Codex 实现后由 Claude 审查并退回，人工批准命令，查看差异并合并', note: '安装包未签名或公证，首次打开时系统可能会显示警告。' , installTitle: '安装', installDesc: '在 Mac 或 Linux 的终端中运行，或在 Windows 的 PowerShell 中运行。', updateTitle: '更新', updateDesc: '同一条命令会将应用替换为最新版本。看板和任务数据会保留。', copy: '复制', copied: '已复制' },
    };

    function detectPlatform() {
      const ua = navigator.userAgent;
      if (/Windows/i.test(ua)) return 'windows';
      if (/Mac OS X/i.test(ua) && !/Mobile/i.test(ua)) return 'mac-arm64';
      if (/Linux/i.test(ua) && !/Android/i.test(ua)) return 'linux';
      return '';
    }
    function detectLang() {
      const saved = localStorage.getItem('lang');
      if (TEXT[saved]) return saved;
      const first = (navigator.language || 'en').slice(0, 2).toLowerCase();
      return TEXT[first] ? first : 'en';
    }

    let version = '';
    let commandOs = detectPlatform() === 'windows' ? 'windows' : 'unix';
    const platform = detectPlatform();
    const fileUrl = (p) => (version ? `https://github.com/${REPO}/releases/download/v${version}/${FILES[p](version)}` : RELEASES);

    function render(lang) {
      const t = TEXT[lang];
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
      document.getElementById('lang').value = lang;
      document.getElementById('headline').textContent = t.headline;
      document.getElementById('note').textContent = t.note;
      document.getElementById('integrations').textContent = t.integrations;
      const migrate = document.getElementById('migrate');
      migrate.textContent = t.migrate;
      migrate.href = lang === 'ja' ? 'migrate-from-vibe-kanban.ja.html' : 'migrate-from-vibe-kanban.html';
      const migrateConductor = document.getElementById('migrateConductor');
      migrateConductor.textContent = t.migrateConductor;
      migrateConductor.href = lang === 'ja' ? 'migrate-from-conductor.ja.html' : 'migrate-from-conductor.html';
      const extras = document.getElementById('footerExtras');
      extras.replaceChildren();
      const stats = document.createElement('a');
      stats.href = 'download-stats.html';
      stats.textContent = t.stats;
      extras.append(stats, document.createTextNode(' · '));
      const demo = document.getElementById('demo');
      demo.alt = t.demo;
      demo.src = `images/${lang}/demo.gif`;
      document.getElementById('progressTitle').textContent = t.progressTitle;
      document.getElementById('progressDesc').textContent = t.progressDesc;
      const progressDemo = document.getElementById('progressDemo');
      progressDemo.alt = t.progressAlt;
      progressDemo.src = `images/${lang}/feature-progress.gif`;
      for (const id of ['installTitle', 'installDesc', 'updateTitle', 'updateDesc']) document.getElementById(id).textContent = t[id];
      for (const b of document.querySelectorAll('[data-copy]')) b.textContent = t.copy;
      for (const c of document.querySelectorAll('[data-command]')) c.textContent = COMMANDS[commandOs];
      for (const b of document.querySelectorAll('#tabs button')) b.setAttribute('aria-pressed', String(b.dataset.os === commandOs));
      const main = document.getElementById('download');
      main.textContent = platform ? t.download.replace('{os}', NAMES[platform]) : t.all;
      main.href = platform ? fileUrl(platform) : RELEASES;
      const others = document.getElementById('others');
      others.replaceChildren();
      for (const p of Object.keys(FILES).filter((x) => x !== platform)) {
        const a = document.createElement('a');
        a.href = fileUrl(p);
        a.textContent = NAMES[p];
        others.append(a);
      }
      const all = document.createElement('a');
      all.href = RELEASES;
      all.textContent = t.all;
      others.append(all);
    }

    const select = document.getElementById('lang');
    select.addEventListener('change', () => {
      localStorage.setItem('lang', select.value);
      render(select.value);
    });
    for (const b of document.querySelectorAll('#tabs button')) {
      b.addEventListener('click', () => {
        commandOs = b.dataset.os;
        render(select.value);
      });
    }
    for (const b of document.querySelectorAll('[data-copy]')) {
      b.addEventListener('click', async () => {
        await navigator.clipboard.writeText(COMMANDS[commandOs]);
        b.textContent = TEXT[select.value].copied;
        setTimeout(() => { b.textContent = TEXT[select.value].copy; }, 1500);
      });
    }
    render(detectLang());
    // 最新の版が分からないとき（API の回数制限など）は、Releases のページへ案内する
    fetch(`https://api.github.com/repos/${REPO}/releases/latest`)
      .then((r) => (r.ok ? r.json() : null))
      .then((r) => {
        if (!r || !r.tag_name) return;
        version = r.tag_name.replace(/^v/, '');
        render(select.value);
      })
      .catch(() => {});
  </script>
</body>
</html>

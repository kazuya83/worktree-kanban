<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:" />
    <title>Worktree Kanban</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="scheduler.css" />
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="nav-wrap">
        <button id="navBtn" class="btn ghost nav-btn" type="button" title="画面を切り替えます" aria-label="メニュー" aria-expanded="false" aria-controls="navMenu"><span data-icon="menu"></span></button>
        <nav id="navMenu" class="nav-menu hidden" aria-label="画面の切り替え">
          <button class="nav-item" type="button" data-view="kanban"><span data-icon="logo"></span>カンバン管理</button>
          <button class="nav-item" type="button" data-view="scheduler"><span data-icon="calendar"></span>タスクスケジューラ</button>
          <button class="nav-item" type="button" data-view="settings"><span data-icon="settings"></span>設定</button>
        </nav>
      </div>
      <div class="brand"><span class="logo" data-icon="logo"></span><span class="brand-text"><span class="brand-name">Worktree Kanban</span><span id="appVersion" class="brand-ver"></span><button id="updateBadge" class="update-badge hidden" type="button" title="設定の「アプリの更新」を開きます"></button></span></div>
      <div id="repoTabs" class="repo-tabs" role="tablist" aria-label="開いているリポジトリ"></div>
      <div class="spacer"></div>
      <span id="remoteInfo" class="pill remote-pill hidden" title="遠隔操作の状態"></span>
      <span id="runInfo" class="pill"></span>
      <button id="rcBtn" class="btn ghost" title="遠隔操作（RC）: ホストの開始・別の PC への接続・SSH の鍵"><span data-icon="monitor"></span><span class="btn-label">RC設定</span></button>
      <button id="mobileBtn" class="btn ghost" title="スマホから使う: 外からスマホのブラウザでボードを見て、指示・承認・回答をします"><span data-icon="phone"></span><span class="btn-label">スマホ</span></button>
      <button id="sessionsBtn" class="btn ghost" title="Claude Code の会話（セッション）を一覧して消します（タスクとは別に管理できます）"><span data-icon="clock"></span><span class="btn-label">セッション</span></button>
      <button id="chatBtn" class="btn chat-btn" title="タスクを作らずに、このリポジトリについてエージェントと話します"><span data-icon="chat"></span><span class="btn-label">会話</span><span id="chatCount" class="chat-count hidden"></span></button>
      <button id="newBtn" class="btn primary" title="新しいタスク"><span data-icon="plus"></span><span class="btn-label">新しいタスク</span></button>
      <div class="notif-wrap">
        <button id="notifBtn" class="btn ghost notif-btn" title="通知"><span data-icon="bell"></span><span id="notifCount" class="notif-count hidden"></span></button>
        <div id="notifPanel" class="notif-panel hidden" role="dialog" aria-label="通知"></div>
      </div>
    </header>
    <div id="envBanner" class="env-banner hidden"></div>
    <div id="interruptBanner" class="int-banner hidden"></div>
    <div class="layout">
      <main id="board" class="board"></main>
      <main id="schedulerView" class="scheduler-view hidden"></main>
      <main id="settingsView" class="settings-view hidden"></main>
      <div id="detailBackdrop" class="d-backdrop hidden"></div>
      <aside id="detail" class="detail hidden">
        <div id="detailResizer" class="d-resizer" title="ドラッグで幅を変えられます（ダブルクリックで元の幅に戻します）"></div>
        <div id="detailTitle" class="d-titlebar"></div>
        <div id="detailHead" class="d-head"></div>
        <nav class="tabs" id="tabs">
          <button data-tab="chat" class="tab active" id="chatTab" title="指示や質問と、それに対するエージェントの最後の返事だけを見ます（ツールの結果などは「ログ」で見られます）">チャット</button>
          <button data-tab="log" class="tab" id="logTab">ログ</button>
          <button data-tab="worktree" class="tab" title="worktree の作業状況（コミット・未コミットの変更・ベースとの関係）を見ます">worktree</button>
          <button data-tab="diff" class="tab">差分</button>
          <button data-tab="progress" class="tab" id="progressTab" title="全体の進み具合（エージェントの TODO・Pipelineのどの工程まで終わったか・サブタスクがいくつ終わったか）を見ます">進捗</button>
          <button data-tab="subtasks" class="tab hidden" id="subtasksTab" title="サブタスクごとの状態を見ます。開始・取り込み・状態の変更もここでできます">サブタスク</button>
          <button data-tab="btw" class="tab" id="btwTab" title="実行中のエージェントに、作業を止めずにメッセージを送ります">btw</button>
          <button data-tab="info" class="tab" title="エージェント・会話・ブランチ・worktree などの情報を見ます">情報</button>
        </nav>
        <div id="detailBody" class="d-body"></div>
        <div id="splitFoot" class="d-vsplit" title="ドラッグで高さを変えられます（ダブルクリックで元の高さに戻します）"></div>
        <div id="detailFoot" class="d-foot">
          <div id="followSkill" class="skill-slot"></div>
          <div id="followAttach" class="attach-bar hidden"></div>
          <div class="d-foot-row composer">
            <textarea id="followInput" rows="2" placeholder="追加の指示を送る（Ctrl/⌘ + Enter で送信）"></textarea>
            <button id="followBtn" class="composer-send" title="送信（Ctrl/⌘ + Enter）" aria-label="送信"><span data-icon="send"></span></button>
          </div>
        </div>
      </aside>
    </div>
    <div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
    <div id="skillPicker" class="modal picker hidden"><div class="modal-box wide" id="skillPickerBox"></div></div>
    <div id="flowModal" class="modal flow hidden"><div class="modal-box flow-box" id="flowModalBox"></div></div>
    <div id="busy" class="busy hidden" role="alert" aria-live="assertive" aria-busy="true"><div class="busy-box"><span class="spinner" aria-hidden="true"></span><span id="busyMsg">処理しています…</span></div></div>
    <div id="toast" class="toast hidden"></div>
    <script src="i18n.js"></script>
    <script src="locales/shell.js"></script>
    <script src="locales/board.js"></script>
    <script src="locales/screens.js"></script>
    <script src="locales/integrations.js"></script>
    <script src="locales/slack.js"></script>
    <script src="locales/phone.js"></script>
    <script src="issue-ref.js"></script>
    <script src="icons.js"></script>
    <script src="diff-parse.js"></script>
    <script src="diff-comments.js"></script>
    <script src="markdown.js"></script>
    <script src="chat-log.js"></script>
    <script src="qr.js"></script>
    <script src="zoom.js"></script>
    <script src="app-view.js"></script>
    <script src="schedule-model.js"></script>
    <script src="flow-model.js"></script>
    <script src="pipeline-pack.js"></script>
    <script src="flow-editor.js"></script>
    <script src="flow-view.js"></script>
    <script src="renderer.js"></script>
    <script src="scheduler-view.js"></script>
  </body>
</html>
